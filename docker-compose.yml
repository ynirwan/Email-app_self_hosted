# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# GENERATED by install.py — do not edit manually.
# Re-run `python3 install.py --reconfigure` to regenerate.
#
# For local development (without install.py), use:
#   docker-compose -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme_run_install_py
      MONGO_INITDB_DATABASE: email_marketing
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Celery broker / result-backend Redis ─────────────────────────────────────
  # noeviction: when memory is full Redis returns OOM errors instead of silently
  # evicting unprocessed Celery task messages.  Campaigns fail loudly so
  # operators get alerted rather than emails disappearing without a trace.
  # Also holds application-critical keys (send locks, dedupe tokens) that must
  # not be evicted — losing a dedup key means a duplicate send.
  #
  # .env must reference this service:
  #   REDIS_URL=redis://redis-broker:6379/0
  redis-broker:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-broker-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Cache / rate-limit Redis ──────────────────────────────────────────────────
  # allkeys-lru: safe to evict — template previews, slowapi counters, and similar
  # caches can be regenerated from the DB.  Kept separate so cache pressure can
  # never reach the broker and destroy in-flight task messages.
  #
  # .env (optional, for cache-aware code):
  #   REDIS_CACHE_URL=redis://redis-cache:6379/0
  redis-cache:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - uploads:/tmp/uploads
    depends_on:
      - mongodb
      - redis-broker
      - redis-cache
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── General-purpose Celery worker ────────────────────────────────────────────
  # Consumes all queues except ses_critical (handled by celery-critical below so
  # hard-bounce/complaint processing is never delayed by batch campaign work).
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=4
      -Q campaigns,automation,ses_events,webhooks,subscribers,suppressions,dlq,monitoring,analytics,templates,cleanup,ab_tests
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - uploads:/tmp/uploads
    depends_on:
      - mongodb
      - redis-broker
    networks:
      - internal

  # ── High-priority SES worker (hard bounces, complaints) ──────────────────────
  # Dedicated consumer for ses_critical.  Keeps deliverability-critical signals
  # (bounces → suppression, complaints → suppression) from being queued behind
  # large campaign batches on the general worker.
  celery-critical:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=2
      -Q ses_critical
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
      - redis-broker
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - celery-beat-data:/var/run/celery
    depends_on:
      - mongodb
      - redis-broker
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mongo-data:
  redis-broker-data:
  uploads:
  celery-beat-data:
  certbot-webroot:
