# nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
# Default/placeholder config.  install.py overwrites this with the correct
# domain and SSL settings during setup.
#
# This file runs on HTTP-only so the container starts cleanly before
# Let's Encrypt certificates are obtained.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # Tracking / webhook public endpoints
    location ~ ^/(track|webhook|unsubscribe|subscribe)/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend (SPA)
    location / {
        proxy_pass       http://frontend:80;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }
}
